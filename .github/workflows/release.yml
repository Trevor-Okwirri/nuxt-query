name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Prepare Nuxt types
        run: pnpm dev:prepare

      - name: Check types
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build package
        run: pnpm prepack

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check version is unpublished
        env:
          PACKAGE_NAME: '@trevor-okwirri/nuxt-query'
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          package_version=$(node -p "require('./package.json').version")
          published_version=$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)
          if [ "$package_version" = "$published_version" ]; then
            echo "Version $package_version is already published. Bump package.json before merging."
            exit 1
          fi

      - name: Publish package
        run: npm publish --access public --provenance
